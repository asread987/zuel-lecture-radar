  # ── 手工登记微信文章（少量、确知链接时用）─────────────────────────────
  - key: wechat-manual-demo
    name: 微信公众号手工源
    group: 手工源
    type: wechat_manual
    enabled: false
    channel: wechat
    urls: []
    note: 直接登记 mp.weixin.qq.com 文章链接，适合少量确知链接的情况

  # ── 搜狗微信关键词检索（兜底，稳定性差，默认关闭）─────────────────────
  - key: sogou-wechat
    name: 搜狗微信检索
    group: 手工源
    type: sogou_wechat
    enabled: false
    channel: wechat
