# =============================================================================
# ZUEL 讲座雷达 · 信息源库
# =============================================================================
# 所有栏目地址均为 2026-09 实地探测所得（用 scripts/discover_sources.py 可重新探测）。
#
# 字段说明：
#   key        唯一标识，用户配置里的 sources 用它来订阅
#   name       展示名（也会出现在报告里）
#   group      分组名，用户配置里也可以用分组名订阅整个学院
#   type       bode（博达CMS栏目页） / rss / wechat_manual / sogou_wechat
#   base bode 站点根地址
#   column bode 栏目 ID（列表页为 <base>/<column>/list.htm）
#   list_url   显式列表页地址，优先级高于 base+column
#   pages      最多翻几页（Bode 分页为 list2.htm、list3.htm …）
#   econ_bias  源级经济学倾向加分（经济学强相关学院 +1，其他 0）
#   channel    展示用：web 官网 / wechat 公众号
#
# 重要提示（关于微信公众号）：
#   微信公众号没有公开内容 API，无法稳定爬取。各学院的公众号内容与官网
#   「学术讲座」栏目高度重合，因此默认只用官网渠道。若你确需公众号渠道，
#   推荐用 RSSHub / wechat2rss 把公众号转成 Feed，再按下面注释里的例子配置
#   type: rss 的源（见文件末尾示例）。
# =============================================================================

