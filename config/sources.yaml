  # ── 微信公众号渠道（默认关闭，配置好 Feed 后把 enabled 改为 true）──────
  # 用法：先自建 RSSHub 或 wechat2rss，把公众号转成 Feed，再填 feed_url。
  # 例如 RSSHub 的微信路由：https://<你的RSSHub>/wechat/xxx
  - key: wechat-jjxy
    name: 经济学院公众号
    group: 经济学院
    type: rss
    enabled: false
    feed_url: ""
    channel: wechat
    econ_bias: 1
    note: 需先自建 RSSHub / wechat2rss 并填入 feed_url

  - key: wechat-csxy
    name: 财政税务学院公众号
