# =============================================================================
# ZUEL 讲座雷达 · 用户配置模板
# =============================================================================
# 用法：
#   cp config/user-template.yaml config/users/我的标识.yaml
#   然后修改下面各项，尤其是 channels 里的推送凭据。
#
# 或者用命令生成（会自动填好 user_id）：
#   python run.py init-user 我的标识
#
# 每位用户一份文件，互不影响：各自的间隔天数、信息源范围、推送渠道。
# ⚠️ 这个文件里有你的推送密钥，config/users/ 已在 .gitignore 里，不要提交。
# =============================================================================

user_id: __USER_ID__
enabled: true

# ── 运行规则 ──────────────────────────────────────────────
interval_days: 7          # 每间隔多少天触发一次
push_time: "20:00"        # 触发当天的推送时刻（调度器每天唤起，逐用户判断是否到期）

# ── 目标信息源范围 ────────────────────────────────────────
# 可写：all / 源 key（如 jjxy-lectures）/ 分组名（学院名，如 经济学院）/ 类型（bode、rss）
# 用 `python run.py sources` 查看全部可用源。
sources:
  - all

# ── 只要「还没开始」的讲座 ────────────────────────────────
upcoming_only: true           # 只收录今天及以后开始的讲座（本系统的核心规则）
upcoming_grace_days: 0        # 给「今天刚开始」的活动留的宽限天数
unknown_date_policy: keep     # 时间读不出来时（海报没识别出日期）：keep 保留 / drop 丢弃
unknown_date_max_age_days: 14 # keep 时，发布已超过 N 天的预告视为过期，丢弃
ocr_poster: true              # 用 macOS 内置 Vision OCR 读海报上的时间/地点（仅 macOS 有效）

# ── 筛选规则 ──────────────────────────────────────────────
econ_only: false              # true = 只推经济学相关讲座
econ_threshold: 3.0           # 经济学相关判定阈值，越大越严格
lecture_only: true            # true = 只保留讲座/讲坛/论坛类内容
drop_review: false            # 额外丢弃「已举办」的回顾（upcoming_only 已能覆盖大部分）

max_items: 40                 # 单次报告最多条目数
lookback_days: 30             # 首次运行（无历史状态）时的回看天数
max_pages: 2                  # 每个源最多翻页数
detail_limit: 25              # 单次最多抓多少篇正文用于抽字段

# ── 推送渠道（可配多个，全部会收到）────────────────────────
# 推送到「指定微信账号」的可行方式见 README 第五节。最少配一个。
# 先用 console 自测（只打印到终端），确认报告内容合适后再换成真实渠道。
channels:
  # - type: serverchan          # Server酱，最省事：扫码绑定微信后拿 SendKey
  #   key: SCTxxxxxxxxxxxxxxxxxxxxxx
  # - type: pushplus            # PushPlus，可用 topic 拉人进群组
  #   token: your_pushplus_token
  # - type: wxpusher            # WxPusher，按 uid 精确投给某个微信号（适合多人各自收）
  #   app_token: AT_xxxxxxxxxxxx
  #   uids: [UID_xxxxxxxxxxxx]
  # - type: wecom               # 企业微信群机器人
  #   webhook: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx
  - type: console

report_dir: out
db: data/radar.db
